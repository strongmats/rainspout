[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rainspout"
version = "1.4.0"
description = "A domain-agnostic frame for building scientific data-processing pipelines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Strong", email = "strongmats@gmail.com" }]
requires-python = ">=3.11"
keywords = ["pipeline", "scientific-computing", "data-processing", "provenance", "workflow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/strongmats/rainspout"
Documentation = "https://github.com/strongmats/rainspout/tree/main/docs"
Issues = "https://github.com/strongmats/rainspout/issues"

[project.scripts]
spout = "rainspout.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rainspout"]

# The sdist ships exactly this and nothing else. Without it, hatchling sweeps
# every non-gitignored file in the tree — on this branch that means
# claude_interactions/ and examples/ ride along. The wheel is unaffected because
# `packages` above pins it.
#
# This must be `only-include`, not `include`. Hatchling's `include` is additive
# to the default VCS-based file selection, so it does not exclude anything; it
# reads like a restriction but is a no-op here. `only-include` is the one that
# actually narrows the set. Verify with `uv build --sdist` and inspect the
# tarball after touching this list.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/rainspout",
    "tests",
    "docs",
    "README.md",
    "RAINSPOUT_DESIGN.md",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rainspout --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["rainspout"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]

[tool.mypy]
python_version = "3.11"
files = ["src/rainspout"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
