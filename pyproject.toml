[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rainspout"
version = "1.0.0"
description = "A domain-agnostic frame for building scientific data-processing pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
spout = "rainspout.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rainspout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rainspout --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["rainspout"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]

[tool.mypy]
python_version = "3.11"
files = ["src/rainspout"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
