[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rainspout-example"
version = "0.1.0"
description = "The pedagogical Rainspout content package: copy this shape"
requires-python = ">=3.11"
dependencies = ["rainspout>=1,<2"]

# The two lines that make `spout` find everything in this package the moment
# it is installed (PACKAGE_AUTHORING §4):
[project.entry-points."rainspout.components"]
rainspout_example = "rainspout_example.components"

[project.entry-points."rainspout.verbs"]
rainspout_example = "rainspout_example.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rainspout_example"]
